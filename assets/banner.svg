<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="neon-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".8"/></linearGradient><linearGradient id="neon-magenta" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f093fb" stop-opacity=".8"/><stop offset="100%" stop-color="#f5576c" stop-opacity=".8"/></linearGradient><linearGradient id="pill-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#334155" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="card-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><pattern id="pixel-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 24 0 L 0 0 0 24"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.25}50%{transform:scale(1.18) translate(-15px,10px);opacity:.45}}@keyframes floatPixel{0%{transform:translateY(0) rotate(0deg);opacity:.3}50%{transform:translateY(-20px) rotate(10deg);opacity:.8}}@keyframes scanlineAnim{0%{transform:translateY(-420px)}}@keyframes shimmerBorder{0%{stroke-dashoffset:0}}.orb-left{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-right{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 300px}.p1{animation:floatPixel 5s ease-in-out infinite}.p2{animation:floatPixel 6.5s ease-in-out infinite 1s}.p3{animation:floatPixel 4.5s ease-in-out infinite 2s}.p4{animation:floatPixel 7s ease-in-out infinite .5s}.scanline{animation:scanlineAnim 7s linear infinite}.animated-border{stroke-dasharray:60 120;animation:shimmerBorder 25s linear infinite}.banner-sub,.banner-title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.banner-title{font-weight:800;letter-spacing:-.02em}.banner-sub{font-weight:400;letter-spacing:.01em}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#pixel-grid)" rx="16"/><circle cx="220" cy="110" r="180" fill="#38bdf8" class="orb-left" filter="url(#glow)"/><circle cx="980" cy="310" r="210" fill="#c084fc" class="orb-right" filter="url(#glow)"/><g opacity=".7"><rect width="18" height="18" x="90" y="70" fill="#38bdf8" class="p1" rx="3"/><rect width="12" height="12" x="120" y="55" fill="#818cf8" class="p2" rx="2"/><rect width="14" height="14" x="75" y="105" fill="#c084fc" class="p3" rx="2"/><rect width="16" height="16" x="150" y="90" fill="#f472b6" class="p4" rx="3"/><rect width="20" height="20" x="1060" y="270" fill="#00f2fe" class="p2" rx="3"/><rect width="14" height="14" x="1100" y="240" fill="#818cf8" class="p1" rx="2"/><rect width="16" height="16" x="1030" y="310" fill="#ec4899" class="p4" rx="3"/><rect width="12" height="12" x="1085" y="315" fill="#f5576c" class="p3" rx="2"/></g><g clip-path="url(#banner-clip)" opacity=".15"><line x1="0" x2="1200" y1="0" y2="0" stroke="#38bdf8" stroke-width="2" class="scanline"/></g><rect width="1060" height="320" x="70" y="50" fill="#0f172a" fill-opacity=".82