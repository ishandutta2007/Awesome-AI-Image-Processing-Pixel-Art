te &amp; Tile Editors</text></g><g transform="translate(600, 275) translate(220, 0)"><rect width="175" height="36" x="-6" y="-18" fill="url(#pill-grad)" stroke="#f472b6" stroke-opacity=".4" stroke-width="1" rx="10"/><text x="81" y="5" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Neural Upscaling</text></g></g><text x="600" y="340" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" letter-spacing=".04em" text-anchor="middle">A curated collection for indie game developers, digital artists, computer vision engineers, and creators.</text></svg>