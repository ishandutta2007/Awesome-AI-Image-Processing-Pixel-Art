<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Vibrant Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="neon-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f5576c" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Pixel Grid Pattern -->
    <pattern id="pixel-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.45; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
    }
    @keyframes floatPixel {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-20px) rotate(10deg); opacity: 0.8; }
      100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
    }
    @keyframes scanlineAnim {
      0% { transform: translateY(-420px); }
      100% { transform: translateY(420px); }
    }
    @keyframes shimmerBorder {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1200; }
    }
    .orb-left {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-right {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .p1 { animation: floatPixel 5s ease-in-out infinite; }
    .p2 { animation: floatPixel 6.5s ease-in-out infinite 1s; }
    .p3 { animation: floatPixel 4.5s ease-in-out infinite 2s; }
    .p4 { animation: floatPixel 7s ease-in-out infinite 0.5s; }
    .scanline {
      animation: scanlineAnim 7s linear infinite;
    }
    .animated-border {
      stroke-dasharray: 60 120;
      animation: shimmerBorder 25s linear infinite;
    }
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .banner-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>

  <!-- Subtle Pixel Grid Overlay -->
  <rect width="1200" height="420" fill="url(#pixel-grid)" rx="16"/>

  <!-- Background Ambient Glow Orbs (Dynamic) -->
  <circle class="orb-left" cx="220" cy="110" r="180" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="orb-right" cx="980" cy="310" r="210" fill="#c084fc" filter="url(#glow)"/>

  <!-- Background Floating Pixel Tiles (Dynamic) -->
  <g opacity="0.7">
    <!-- Top-left cluster -->
    <rect class="p1" x="90" y="70" width="18" height="18" rx="3" fill="#38bdf8"/>
    <rect class="p2" x="120" y="55" width="12" height="12" rx="2" fill="#818cf8"/>
    <rect class="p3" x="75" y="105" width="14" height="14" rx="2" fill="#c084fc"/>
    <rect class="p4" x="150" y="90" width="16" height="16" rx="3" fill="#f472b6"/>
    <!-- Bottom-right cluster -->
    <rect class="p2" x="1060" y="270" width="20" height="20" rx="3" fill="#00f2fe"/>
    <rect class="p1" x="1100" y="240" width="14" height="14" rx="2" fill="#818cf8"/>
    <rect class="p4" x="1030" y="310" width="16" height="16" rx="3" fill="#ec4899"/>
    <rect class="p3" x="1085" y="315" width="12" height="12" rx="2" fill="#f5576c"/>
  </g>

  <!-- Moving Scanning Light Beam (Dynamic) -->
  <g opacity="0.15" clip-path="url(#banner-clip)">
    <line class="scanline" x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Subtle Card Container in Center Foreground -->
  <rect x="70" y="50" width="1060" height="320" rx="16" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>
  
  <!-- Animated Border Accent -->
  <rect class="animated-border" x="70" y="50" width="1060" height="320" rx="16" fill="none" stroke="url(#title-grad)" stroke-width="2" opacity="0.6"/>

  <!-- Top Pill / Status Badge -->
  <g transform="translate(600, 95)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="-146" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-132" y="4.5" fill="#94a3b8" font-size="12.5" font-family="system-ui, sans-serif" font-weight="600" letter-spacing="0.08em">CURATED ECOSYSTEM • 2026 EDITION</text>
  </g>

  <!-- Foreground Title -->
  <text class="banner-title" x="600" y="165" text-anchor="middle" font-size="44" fill="url(#title-grad)">
    Awesome AI Image Processing &amp; Pixel Art
  </text>

  <!-- Foreground Subtitle -->
  <text class="banner-sub" x="600" y="208" text-anchor="middle" font-size="18.5" fill="#cbd5e1">
    SaaS Platforms • Neural Quantization • Sprite Editors • Open-Source Models
  </text>

  <!-- Dynamic Feature Badges / Foreground Pills -->
  <g transform="translate(600, 275)">
    <!-- Pill 1 -->
    <g transform="translate(-390, 0)">
      <rect x="-6" y="-18" width="180" height="36" rx="10" fill="url(#pill-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="84" y="5" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif" font-weight="600">🎮 Pixel Art Synthesis</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-185, 0)">
      <rect x="-6" y="-18" width="175" height="36" rx="10" fill="url(#pill-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="81" y="5" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif" font-weight="600">📐 Grid Restoration</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(15, 0)">
      <rect x="-6" y="-18" width="180" height="36" rx="10" fill="url(#pill-grad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
      <text x="84" y="5" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif" font-weight="600">🪄 Sprite &amp; Tile Editors</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(220, 0)">
      <rect x="-6" y="-18" width="175" height="36" rx="10" fill="url(#pill-grad)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="81" y="5" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif" font-weight="600">⚡ Neural Upscaling</text>
    </g>
  </g>

  <!-- Footer Tagline inside container -->
  <text x="600" y="340" text-anchor="middle" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" letter-spacing="0.04em">
    A curated collection for indie game developers, digital artists, computer vision engineers, and creators.
  </text>
</svg>
